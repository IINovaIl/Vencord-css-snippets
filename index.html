<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vencord CSS Snippets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Syne:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { max-width: 100%; overflow-x: hidden; }

    :root {
      --bg:       #07080f;
      --surface:  #0e101a;
      --surface2: #080910;
      --border:   #1c1f30;
      --text:     #dde1f5;
      --muted:    #5a5f7a;
      --accent:   #8b7fff;
      --green:    #5ec4b0;
    }

    /* ── starfield canvas ── */
    #stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── nebula glows ── */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 600px;
      height: 600px;
      top: -180px;
      left: -150px;
      background: radial-gradient(circle, rgba(80,50,180,0.18) 0%, transparent 70%);
    }

    body::after {
      width: 500px;
      height: 500px;
      bottom: -100px;
      right: -100px;
      background: radial-gradient(circle, rgba(30,90,160,0.15) 0%, transparent 70%);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      padding: 3rem 4rem;
      position: relative;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    header { margin-bottom: 2.5rem; }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      letter-spacing: 0.01em;
    }

    header p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--muted);
    }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    /* ── grid ── */
    #snippets-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1rem;
    }

    @media (max-width: 900px) {
      #snippets-list { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      body { padding: 2rem 1.25rem; }
      #snippets-list { grid-template-columns: 1fr; }
    }

    /* ── card ── */
    .snippet-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      transition: border-color .2s;
      min-width: 0;
    }

    .snippet-card:hover {
      border-color: rgba(139,127,255,0.35);
    }

    .snippet-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 5px;
    }

    .snippet-desc {
      font-size: 11.5px;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
      margin-bottom: 14px;
    }

    /* ── import block ── */
    .import-block {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      display: flex;
      align-items: stretch;
      overflow: hidden;
      min-width: 0;
    }

    .import-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #9098bb;
      padding: 10px 12px;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
      user-select: all;
    }

    .import-code .kw  { color: var(--accent); }
    .import-code .fn  { color: var(--accent); }
    .import-code .url { color: var(--green); }

    .copy-btn {
      background: rgba(139,127,255,0.07);
      border: none;
      border-left: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      padding: 0 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }

    .copy-btn:hover  { background: rgba(139,127,255,0.18); color: var(--text); }
    .copy-btn.copied { color: var(--green); }

    .copy-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <div class="container">
    <header>
      <h1>Vencord CSS Snippets</h1>
      <p># paste an @import into Quick CSS — no clutter — all credits go to people in the Vencord server</p>
    </header>

    <hr />

    <div id="snippets-list"></div>
  </div>

  <script>
    // ── starfield ────────────────────────────────────────────────
    (function () {
      const canvas = document.getElementById('stars');
      const ctx    = canvas.getContext('2d');
      let stars    = [];

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function seed() {
        stars = Array.from({ length: 220 }, () => ({
          x:  Math.random(),
          y:  Math.random(),
          r:  Math.random() * 1.1 + 0.2,
          a:  Math.random() * 0.6 + 0.15,
          sp: Math.random() * 0.4 + 0.1,
          t:  Math.random() * Math.PI * 2,
        }));
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const now = performance.now() / 1000;
        for (const s of stars) {
          s.t += s.sp * 0.008;
          const alpha = s.a * (0.7 + 0.3 * Math.sin(s.t));
          ctx.beginPath();
          ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(200,210,255,${alpha})`;
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      resize();
      seed();
      draw();
      window.addEventListener('resize', resize);
    })();

    // ── snippets ─────────────────────────────────────────────────
    // ============================================================
    //  ADD YOUR SNIPPETS HERE
    //  Each entry needs:
    //    name  — display name shown on the card
    //    desc  — one-line description of what it does
    //    file  — filename inside snippets/, e.g. "MySnippet.css"
    // ============================================================
    const BASE = 'https://iinovail.github.io/Vencord-css-snippets/snippets/';

    const SNIPPETS = [
      {
        name: 'PopOutActivityBackground',
        desc: 'Gives activity in the user popout a background based on the activity icon. Credits to Blade0.',
        file: 'PopOutActivityBackground.css',
      },
      {
        name: 'BetterServerBoostPage',
        desc: 'Improves the appearance of the server boost page. Credits to Julienraptor01.',
        file: 'BetterServerBoostPage.css',
      },
      {
        name: 'ChatBubbles',
        desc: 'Gives chat messages rounded corners and a subtle background. Credits to windows rice farmer.',
        file: 'ChatBubbles.css',
      },
      {
        name: 'BetterUserPopOutRoles',
        desc: 'Improves the appearance of user roles in the popout. Credits to Julienraptor01.',
        file: 'BetterUserPopOutRoles.css',
      },
      {
        name: 'CompactedCMDMenu',
        desc: 'Improves the appearance of the command menu. Credits to Hades.',
        file: 'CompactedCMDMenu.css',
      },
      {
        name: 'MoveProfileButtons',
        desc: 'Moves profile buttons to a more convenient location. Credits to Obsidian.',
        file: 'MoveProfileButtons.css',
      },
      {
        name: 'FixAboutMeSize',
        desc: 'Fixes the size of the about me section in the user profile. Credits to HeroOfDungeon.',
        file: 'FixAboutMeSize.css',
      },
      {
        name: 'HideNewMuteAndDeafenButtons',
        desc: 'Hides the new mute and deafen buttons. Credits to fazzi.',
        file: 'HideNewMuteAndDeafenButtons.css',
      },
      {
        name: 'SideBarCat',
        desc: 'Adds a cat image to the sidebar. Credits to Computing Cat.',
        file: 'SideBarCat.css',
      },
      {
        name: 'ModernPinDms',
        desc: 'Improves the appearance of pinned DMs. Credits to emily.',
        file: 'ModernPinDms.css',
      },
      {
        name: 'BorderedEmbeds',
        desc: 'Improves the appearance of embeds. Credits to windows rice farmer.',
        file: 'BorderedEmbeds.css',
      },
      {
        name: 'ColoredEmbeds',
        desc: 'Gives embeds a colored border based on their type. Credits to Blade0.',
        file: 'ColoredEmbeds.css',
      },
      {
        name: 'DmTopBar',
        desc: 'Moves the Dms to a horizontal bar at the top. Credits to refact0r.',
        file: 'DmTopBar.css',
      },
    ];
    // ============================================================

    const ICON_COPY  = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
    const ICON_CHECK = `<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>`;

    function renderSnippets() {
      document.getElementById('snippets-list').innerHTML = SNIPPETS.map(s => {
        const url  = BASE + s.file;
        const stmt = `@import url(${url});`;
        return `
          <div class="snippet-card">
            <p class="snippet-name">${s.name}</p>
            <p class="snippet-desc">${s.desc}</p>
            <div class="import-block">
              <span class="import-code" title="${stmt}">
                <span class="kw">@import</span> <span class="fn">url</span>(<span class="url">${url}</span>);
              </span>
              <button class="copy-btn" data-import="${stmt}" onclick="copyImport(this)" aria-label="Copy import">
                ${ICON_COPY} copy
              </button>
            </div>
          </div>`;
      }).join('');
    }

    function copyImport(btn) {
      navigator.clipboard.writeText(btn.getAttribute('data-import')).then(() => {
        btn.classList.add('copied');
        btn.innerHTML = ICON_CHECK + ' copied';
        setTimeout(() => {
          btn.classList.remove('copied');
          btn.innerHTML = ICON_COPY + ' copy';
        }, 2200);
      });
    }

    renderSnippets();
  </script>
</body>
</html>
